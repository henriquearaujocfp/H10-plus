pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // espelho do Maven Central mantido pelo Google (contorna falhas momentâneas do repositório principal)
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    }
}
rootProject.name = 'h10plus'
include ':app'
include ':wear'
